[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fermion-tools"
version = "0.1.0"
description = "Preservation and translation tooling for Fermion on PC-98"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fermion = "fermion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fermion"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
