[[entries]]
id = "launch-opposed-kanzaki-going"
file = "DISKA/F0001.MES"
offset = 0x12e6
source_mode = 1
target_mode = 2
source = "神崎博士が行くことに周囲も反対したけど、あたしも反対だった。"
translation = "Everyone around her objected, and so did I."
speaker = "Connie"
context = "Connie recalls resistance to Kanzaki piloting."
status = "qa-ready"
notes = "Her personal objection is given equal weight with institutional opposition."

[[entries]]
id = "launch-risk-in-kanzaki-place"
file = "DISKA/F0001.MES"
offset = 0x130f
source_mode = 1
target_mode = 2
source = "【コニー】（だから・・・・・・・・・あたしが神崎博士の代わりに、危険を犯してもいいと思った。）"
translation = "[CONNIE] (So I decided I could take the risk in Dr. Kanzaki's place.)"
speaker = "コニー"
context = "Connie explains her protective motive."
status = "qa-ready"
notes = "The phrasing is resolute without turning her devotion into a boast."

[[entries]]
id = "launch-devotion-silence"
file = "DISKA/F0001.MES"
offset = 0x1347
source_mode = 1
target_mode = 2
