speaker = "Connie"
context = "Connie recalls choosing this mission."
status = "qa-ready"
notes = "The active choice is central to her sense of duty toward Kanzaki."

[[entries]]
id = "launch-mutant-reflexes-qualified"
file = "DISKA/F0001.MES"
offset = 0x1292
source_mode = 1
target_mode = 2
source = "もともと、ミュータントは運動神経にも優れているので、あたしはすぐに認められた。"
translation = "Mutants naturally have exceptional reflexes, so I was approved right away."
speaker = "Connie"
context = "Connie explains why Project D accepted her."
status = "qa-ready"
notes = "運動神経 is idiomatically reflexes and coordination, not literal motor nerves."

[[entries]]
id = "launch-kanzaki-was-to-go"
file = "DISKA/F0001.MES"
offset = 0x12c2
source_mode = 1
target_mode = 2
source = "【コニー】（本当は神崎博士が行くはずだった・・・・・・。）"
translation = "[CONNIE] (Dr. Kanzaki was supposed to go...)"
speaker = "コニー"
context = "Connie reveals the original pilot."
status = "qa-ready"
