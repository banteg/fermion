speaker = "コニー"
context = "Connie describes Marie's oppressive presence."
status = "qa-ready"
notes = "The sensation is figurative atmosphere, clarified by Connie shortly afterward."

[[entries]]
id = "launch-marie-makes-her-tense"
file = "DISKA/F0001.MES"
offset = 0x1589
source_mode = 1
target_mode = 2
source = "【コニー】（マリー博士には悪いけど、あの人の側に居ると変に緊張しちゃう・・・。）"
translation = "[CONNIE] (Sorry, Dr. Marie, but being near her makes me tense in the strangest way...)"
speaker = "コニー"
context = "Connie admits her discomfort around Marie."
status = "qa-ready"
notes = "The apology is internal and reflexively polite, keeping Connie sympathetic rather than accusatory."

[[entries]]
id = "launch-feels-tired"
file = "DISKA/F0001.MES"
offset = 0x15ca
source_mode = 1
target_mode = 2
source = "【コニー】（何だか・・・、疲れちゃった・・・。）"
translation = "[CONNIE] (Somehow... I'm exhausted...)"
speaker = "コニー"
context = "Marie's visit leaves Connie drained."
status = "qa-ready"
notes = "The casual ちゃった softens the admission."

[[entries]]
id = "launch-air-changes-near-marie"
file = "DISKA/F0001.MES"
offset = 0x15e9
source_mode = 1
target_mode = 2
source = "あの人が近くに来ると、空気の流れが変わる。"
translation = "Whenever she comes close, even the air seems to shift."
speaker = "Connie"
context = "Connie elaborates on Marie's intimidating atmosphere."
status = "qa-ready"
notes = "Seems' keeps the description figurative rather than granting Marie a supernatural effect."

[[entries]]
id = "launch-skin-prickles"
file = "DISKA/F0001.MES"
offset = 0x1605
source_mode = 1
target_mode = 2
source = "あたしの肌にピリピリとした感覚が伝わってくる。"
translation = "A prickling sensation runs across my skin."
speaker = "Connie"
context = "Connie describes her bodily response to Marie."
status = "qa-ready"
notes = "Prickling' carries ピリピリ without implying literal electricity."

[[entries]]
id = "launch-just-the-atmosphere"
file = "DISKA/F0001.MES"
offset = 0x1625
source_mode = 1
target_mode = 2
source = "【コニー】（なんて・・・ね。それほど雰囲気が変わるって事だけど・・・。）"
translation = "[CONNIE] (Well... not literally. That's just how much the mood changes around her...)"
speaker = "コニー"
context = "Connie corrects her own dramatic description."
status = "qa-ready"
notes = "This self-correction preserves her comic overthinking and confirms the prior imagery is figurative."

[[entries]]
id = "launch-marie-gentler-earlier"
file = "DISKA/F0001.MES"
offset = 0x1650
source_mode = 1
target_mode = 2
source = "【コニー】（さっきは少し優しかった・・・・・・・・・。）"
translation = "[CONNIE] (She was a little gentler earlier...)"
speaker = "コニー"
context = "Connie reassesses Marie's pulse check."
status = "qa-ready"
notes = "Gentler' is comparative; Connie does not suddenly call Marie warm."

[[entries]]
id = "launch-marie-touch-no-malice"
file = "DISKA/F0001.MES"
offset = 0x1673
source_mode = 1
target_mode = 2
source = "脈を診てもらうとき、肌が触れたけど、邪心は伝わってこなかった。"
translation = "Our skin touched when she checked my pulse, but I felt no ill intent from her."
speaker = "Connie"
context = "Connie uses touch-empathy to evaluate Marie."
status = "qa-ready"
notes = "邪心 is contextualized as harmful intent, not religious evil."

[[entries]]
id = "launch-hard-to-read-marie"
file = "DISKA/F0001.MES"
offset = 0x169c
source_mode = 1
target_mode = 2
source = "もっとも、普段、接触のない人だけに、感情を読み取るのは難しい。"
translation = "Still, I rarely touch her, so her feelings are hard for me to read."
speaker = "Connie"
context = "Connie qualifies the certainty of her empathic reading."
status = "qa-ready"
notes = "The limitation keeps her touch-sense from becoming infallible."

[[entries]]
id = "launch-strong-emotion-readable"
file = "DISKA/F0001.MES"
offset = 0x16c7
source_mode = 1
target_mode = 2
source = "感情に起伏があれば、読めないこともないけど。"
translation = "If her emotions surged, I might be able to read them."
speaker = "Connie"
context = "Connie explains the threshold of her touch-empathy."
status = "qa-ready"
notes = "Might' preserves the tentative double negative."

[[entries]]
id = "launch-how-much-longer"
file = "DISKA/F0001.MES"
offset = 0x16fd
source_mode = 1
target_mode = 2
source = "【コニー】（あとどれくらいかなぁ・・・・・・・・・。）"
translation = "[CONNIE] (How much longer...?)"
speaker = "コニー"
context = "Connie returns to waiting for launch."
status = "qa-ready"
notes = "The plain impatience resets the scene after her reflection on Marie."

[[entries]]
id = "launch-after-adjustments"
file = "DISKA/F0001.MES"
offset = 0x171e
source_mode = 1
target_mode = 2
source = "マシンの調整が終わり次第、発進だ。"
translation = "We launch as soon as the machine adjustments are complete."
speaker = "Connie"
context = "Connie states the remaining pre-launch condition."
status = "qa-ready"
notes = "The collective 'we' refers to the Project D team initiating her departure."

[[entries]]
id = "launch-afraid-of-unknown"
file = "DISKA/F0001.MES"
offset = 0x1743
source_mode = 1
target_mode = 2
source = "【コニー】（確かに・・・、未知の世界へ行く不安はあるわね・・・。）"
translation = "[CONNIE] (Of course... I am afraid of going into an unknown world...)"
speaker = "コニー"
context = "Connie admits the obvious source of her nerves."
status = "qa-ready"
notes = "The composed phrasing shows her trying to reason herself calm."

[[entries]]
id = "launch-believed-kanzaki-mother"
file = "DISKA/F0001.MES"
offset = 0x1774
source_mode = 1
target_mode = 2
source = "幼い頃は、神崎博士を母親だと信じていた。"
translation = "When I was little, I believed Dr. Kanzaki was my mother."
speaker = "Connie"
context = "Connie recalls her earliest relationship to her creator."
status = "qa-ready"
notes = "Little' describes her developmental stage, not a long chronological childhood."

[[entries]]
id = "launch-learned-not-mother"
file = "DISKA/F0001.MES"
offset = 0x1791
source_mode = 1
target_mode = 2
source = "だけど、ミュータントとヒトとの違いが理解できるようになると、母親じゃないとわかった。"
translation = "But once I understood the difference between mutants and humans, I knew she wasn't."
speaker = "Connie"
context = "Connie learned that being created was not the same as being born."
status = "qa-ready"
notes = "The omitted noun after 'wasn't' naturally refers back to mother."

[[entries]]
id = "launch-cried-all-night"
file = "DISKA/F0001.MES"
offset = 0x17c4
source_mode = 1
target_mode = 2
source = "【コニー】（あの時は一晩中、泣き続けたっけ・・・。）"
translation = "[CONNIE] (I cried all night when I found out...)"
speaker = "コニー"
context = "Connie remembers the grief of learning her origin."
status = "qa-ready"
notes = "When I found out' ties the memory to the preceding realization without merging records."

[[entries]]
id = "launch-kanzaki-held-her"
file = "DISKA/F0001.MES"
offset = 0x17e6
source_mode = 1
target_mode = 2
source = "あたしが自分の生い立ちを理解したとき、神崎博士は泣きじゃくるあたしをずっと抱いてくれた。"
translation = "When I understood how I came to exist, Dr. Kanzaki held me while I sobbed and never let go."
speaker = "Connie"
context = "Kanzaki comforts Connie through the identity crisis."
status = "qa-ready"
notes = "How I came to exist' is more precise than 'where I came from' for an engineered person."

[[entries]]
id = "launch-kanzaki-many-roles"
file = "DISKA/F0001.MES"
offset = 0x181d
source_mode = 1
target_mode = 2
source = "【コニー】（神崎博士は、あたしにとって、姉や母親であり、仕事の上司であり・・・。一番信頼できる人だ。）"
translation = "[CONNIE] (To me, Dr. Kanzaki is an older sister, a mother, and my superior... the person I trust most.)"
speaker = "コニー"
context = "Connie defines her layered attachment to Kanzaki."
status = "qa-ready"
notes = "The roles stay cumulative and unresolved; English must not flatten Kanzaki into only one relationship."

[[entries]]
id = "launch-mutant-growth-varies"
file = "DISKA/F0001.MES"
offset = 0x186d
source_mode = 1
target_mode = 2
source = "ミュータントは成長期間が不安定だ。掛け合わせた遺伝子によって違いができる。"
translation = "Mutant growth is unpredictable. It varies with the genes used to create us."
speaker = "Connie"
context = "Connie explains mutant maturation."
status = "qa-ready"
notes = "The second sentence keeps the engineered-genetics cause explicit."

[[entries]]
id = "launch-three-years-to-adolescence"
file = "DISKA/F0001.MES"
offset = 0x189c
source_mode = 1
target_mode = 2
source = "あたしやレミアのように、生まれて３年でヒトの第２次成長期まで成長するのもいる。"
translation = "Some of us, like Remia and me, reach human adolescence only three years after birth."
speaker = "Connie"
context = "Connie distinguishes lived age from physical development."
status = "qa-ready"
notes = "第2次成長期 is naturalized as adolescence; the three-year interval remains unambiguous."

[[entries]]
id = "launch-cell-age-seventeen"
file = "DISKA/F0001.MES"
offset = 0x18ce
source_mode = 1
target_mode = 2
source = "あたしは細胞年齢だと１７才だけど、造られてからは３年しか経ってない。"
translation = "My cells are about seventeen years old, but only three years have passed since I was created."
speaker = "Connie"
context = "Connie states both her physical and chronological age."
status = "qa-ready"
notes = "Both ages are preserved exactly because their contradiction is central to her characterization."

[[entries]]
id = "launch-growth-now-human-rate"
file = "DISKA/F0001.MES"
offset = 0x18ff
source_mode = 1
target_mode = 2
source = "もう成長は緩やかになっていて、あとはヒトの成長速度で成長する。"
translation = "My growth has slowed now. From here on, I'll age at the same rate as a human."
speaker = "Connie"
context = "Connie clarifies that her accelerated maturation has ended."
status = "qa-ready"
notes = "Age' is natural English for continued physical growth after the initial acceleration."

[[entries]]
id = "launch-kanzaki-goggles"
file = "DISKA/F0001.MES"
offset = 0x1939
source_mode = 1
target_mode = 2
source = "神崎博士は公害で目を痛めたのか、ゴーグルをよくつけている。"
translation = "Perhaps pollution damaged Dr. Kanzaki's eyes. She usually wears goggles."
speaker = "Connie"
context = "Connie considers Kanzaki's concealed expression."
status = "qa-ready"
notes = "Perhaps' preserves Connie's uncertainty about the reason."

[[entries]]
id = "launch-sees-kanzaki-face"
file = "DISKA/F0001.MES"
offset = 0x195f
source_mode = 1
target_mode = 2
source = "【コニー】（あの人のお風呂上がりに、あたしが髪の毛をブラッシングしてあげるとき、素顔を見るくらいかな・・・。）"
translation = "[CONNIE] (I only see her bare face after her bath, when I brush her hair...)"
speaker = "コニー"
