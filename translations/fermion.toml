[[entries]]
id = "opening-doctor-warning"
file = "DISKA/FOP.MES"
offset = 0x016c
source_mode = 1
target_mode = 2
source = "「見ない方がいいですよ。あなたのお気持ちはわかりますが・・・。」"
translation = "\"You shouldn't look. I understand how you feel, but...\""
speaker = "prologue-doctor"
context = "Unlabelled prologue exchange; the doctor cautions the viewpoint woman."
status = "qa-ready"
box_width = 61
notes = """
The doctor speaks gently and professionally rather than issuing a blunt order.
The ending identifies the viewpoint woman as Marie, but the doctor is never
named. This wording restores あなたのお気持ちは (“how you feel”) after the
shorter renderer proof. ASCII punctuation remains runtime-proven; this revised
line awaits the prologue QA playtest.
"""

[[entries]]
id = "opening-request-to-see-him"
file = "DISKA/FOP.MES"
offset = 0x0193
source_mode = 1
target_mode = 2
source = "『いいえ・・・。私の・・・・・・大切な人です。見届けさせてください。』"
translation = "\"No... He was... very dear to me. Please let me see him.\""
speaker = "Marie Procyon"
context = "Unlabelled prologue exchange; the viewpoint woman answers the doctor."
status = "qa-ready"
box_width = 61
notes = """
The ending establishes the unnamed mourner as Marie and the dead man as Akira.
大切な人 is deliberately understated: “very dear to me” preserves Marie's
emotional reserve before it breaks. 見届けさせてください literally asks to
see the matter through; in this immediate request to view his body, “let me see
him” is the natural English action without inventing a farewell ritual.
"""

[[entries]]
id = "opening-doctor-this-way"
file = "DISKA/FOP.MES"
offset = 0x01bc
source_mode = 1
target_mode = 2
source = "「・・・・・・・・・・・・・・・・・・わかりました。・・・こちらです・・・。」"
translation = "\"...Very well. This way...\""
speaker = "prologue-doctor"
context = "Unlabelled prologue exchange; the doctor relents and leads the way."
status = "qa-ready"
box_width = 61
notes = """
The first renderer proof omitted わかりました to conserve bytes. Relocating
builds remove that constraint, so “Very well” restores the doctor's reluctant
assent. The long source silence is compressed to one English pause under the
locked ellipsis policy.
"""

[[entries]]
id = "opening-follow-doctor"
file = "DISKA/FOP.MES"
offset = 0x01e8
source_mode = 1
target_mode = 2
source = "私は、廊下を案内して歩く医師の後ろを歩いた。"
translation = "I followed the doctor as we walked down the corridor."
speaker = "Marie Procyon"
context = "Bedside prologue; Marie follows the doctor toward Akira's room."
status = "qa-ready"
box_width = 61
notes = "The first-person narration is Marie's. The English avoids assigning the unnamed doctor a gender and fits one runtime line without losing the guided movement."

[[entries]]
id = "opening-final-look"
file = "DISKA/FOP.MES"
offset = 0x0207
source_mode = 1
target_mode = 2
source = "彼と別れる前に、彼のすべてを見ておきたかった。"
translation = "Before saying goodbye, I wanted to see all of him once more."
speaker = "Marie Procyon"
context = "Bedside prologue; Marie explains why she insisted on seeing Akira's body."
status = "qa-ready"
box_width = 61
notes = "別れる is the final parting implied by the death scene. 'Once more' carries 見ておきたかった without making the line clinical."

[[entries]]
id = "opening-enter-room"
file = "DISKA/FOP.MES"
offset = 0x0225
source_mode = 1
target_mode = 2
source = "廊下を曲って部屋に入った。"
translation = "We rounded a corner and entered a room."
speaker = "Marie Procyon"
context = "Bedside prologue; the doctor and Marie reach Akira's room."
status = "qa-ready"
box_width = 61
notes = "The Japanese omits its subject; 'we' follows the two people already moving together."

[[entries]]
id = "opening-doctor-steps-aside"
file = "DISKA/FOP.MES"
offset = 0x0238
source_mode = 1
target_mode = 2
source = "医師がベッドの脇に避ける。"
translation = "At the bedside, the doctor stepped aside."
speaker = "Marie Procyon"
context = "Bedside prologue; Marie's narration as the doctor reveals Akira."
status = "qa-ready"
box_width = 61
notes = "脇に避ける describes the doctor moving out of Marie's sightline beside the bed."

[[entries]]
id = "opening-caught-breath"
file = "DISKA/FOP.MES"
offset = 0x02b0
source_mode = 1
target_mode = 2
source = "『・・・・・・・・・ッ・・・・・・』"
translation = "\"...!\""
speaker = "Marie Procyon"
context = "Bedside prologue; Marie catches her breath on seeing Akira."
status = "qa-ready"
box_width = 61
notes = "The small ッ marks a choked intake rather than a lexical utterance; the record remains a separate emotional beat."

[[entries]]
id = "opening-inner-wail"
file = "DISKA/FOP.MES"
offset = 0x02c7
source_mode = 1
target_mode = 2
source = "（ああ・・・・・・・・・。ああ・・・・・・・・・）"
translation = "(Oh... Oh...)"
speaker = "Marie Procyon"
context = "Bedside prologue; Marie's first internal reaction to Akira's body."
status = "qa-ready"
box_width = 61
notes = "The repeated ああ is grief, not exposition. Parentheses preserve the source's internal-voice distinction."

[[entries]]
id = "opening-akira-there"
file = "DISKA/FOP.MES"
offset = 0x02e5
source_mode = 1
target_mode = 2
source = "彼の、姿が・・・そこにあった。"
translation = "There... he was."
speaker = "Marie Procyon"
context = "Bedside prologue; Marie recognizes Akira on the bed."
status = "qa-ready"
box_width = 61
notes = "The broken source syntax is preserved as a pause before recognition, without the stiffer literal 'his form was there.'"

[[entries]]
id = "opening-sits-bedside"
file = "DISKA/FOP.MES"
offset = 0x02fa
source_mode = 1
target_mode = 2
source = "私は、倒れそうになる体を支えて、ゆっくりと彼のベッドの側へ座った。"
translation = "Fighting not to collapse, I slowly sat beside his bed."
speaker = "Marie Procyon"
context = "Bedside prologue; Marie forces herself to approach Akira."
status = "qa-ready"
box_width = 61
notes = "倒れそうになる体を支えて is physical self-control under shock; 'fought to keep from collapsing' is natural first-person English."

[[entries]]
id = "opening-speaks-unheard"
file = "DISKA/FOP.MES"
offset = 0x0326
source_mode = 1
target_mode = 2
source = "彼には聞こえないとわかっていても、私は話さずにはいられなかった。"
translation = "Even knowing he couldn't hear me, I couldn't keep silent."
speaker = "Marie Procyon"
context = "Bedside prologue; Marie begins speaking to the dead Akira."
status = "qa-ready"
box_width = 61
notes = "The repetition of 'couldn't' matches the source's helpless compulsion and Marie's collapsing restraint."

[[entries]]
id = "opening-apology"
file = "DISKA/FOP.MES"
offset = 0x034d
source_mode = 1
target_mode = 2
source = "『ごめんなさい・・・・・・・・・。』"
translation = "\"I'm sorry...\""
speaker = "Marie Procyon"
context = "Bedside prologue; Marie apologizes to Akira."
status = "qa-ready"
box_width = 61
notes = "A plain apology is stronger here than expanding the unstated cause of Marie's guilt."

[[entries]]
id = "opening-grief-breaks"
file = "DISKA/FOP.MES"
offset = 0x0366
source_mode = 1
target_mode = 2
source = "悲しみが大きくなって、声が溢れて止まらない。"
translation = "My grief swelled, and the words came pouring out."
speaker = "Marie Procyon"
context = "Bedside prologue; narration before Marie loses her formal composure."
status = "qa-ready"
box_width = 61
notes = "The source says her voice overflowed and would not stop. English 'words came pouring out' preserves the image without sounding physiological."

[[entries]]
id = "opening-cries-akira"
file = "DISKA/FOP.MES"
offset = 0x0385
source_mode = 1
target_mode = 2
source = "『アキラ！　アキラ！！　・・・どうして・・・・・・私を残して・・・。』"
translation = "\"Akira! Akira!! Why...? Why did you leave me...?\""
speaker = "Marie Procyon"
context = "Bedside prologue; Marie cries out to Akira."
status = "qa-ready"
box_width = 61
notes = "The repeated 'Why' gives the interrupted どうして its spoken object without weakening 私を残して, 'leave me behind.'"

[[entries]]
id = "opening-refuses-loss"
file = "DISKA/FOP.MES"
offset = 0x03ae
source_mode = 1
target_mode = 2
source = "『嫌！！　いやぁぁぁぁぁぁ！！！　アキラ・・・、ああぁぁぁぁぁぁ・・・。』"
translation = "\"No!! No, no!! Akira... Ahhh...!\""
speaker = "Marie Procyon"
context = "Bedside prologue; Marie's grief becomes an uncontrolled wail."
status = "qa-ready"
box_width = 61
notes = "The prolonged vowels are reduced but not sanitized: this is the moment Marie's emotional armor breaks completely."

[[entries]]
id = "opening-blames-herself"
file = "DISKA/FOP.MES"
offset = 0x03d9
source_mode = 1
target_mode = 2
source = "『私の・・・、・・・私のせいよ・・・・、私がもっと早く・・・。・・・アキラ、アキラ・・・・・・。』"
translation = "\"It's... it's my fault... If only I'd been faster...\nAkira... Akira...\""
speaker = "Marie Procyon"
context = "Bedside prologue; Marie blames herself for failing to save Akira in time."
status = "qa-ready"
box_width = 61
notes = "もっと早く is left incomplete in Japanese; 'If only I'd been faster' preserves that guilt without inventing the failed intervention. The explicit line break prevents a character-level wrap from stranding Akira's name."

[[entries]]
id = "opening-kanzaki-limit"
file = "DISKA/FOP.MES"
offset = 0x045d
source_mode = 1
target_mode = 2
source = "「・・・・・・・・・。私でもこれ以上のことは無理・・・、考え直して。」"
translation = "\"I can't do any more than this... Please reconsider.\""
speaker = "Kaori Kanzaki"
context = "Later prologue exchange; Kanzaki resists Marie's demand concerning Project D."
status = "qa-ready"
box_width = 61
notes = "The ending resolves the unlabelled speaker as Kanzaki. Her controlled request contrasts with the panic that follows."

[[entries]]
id = "opening-marie-threat"
file = "DISKA/FOP.MES"
offset = 0x0489
source_mode = 1
target_mode = 2
source = "『・・・・・・止めてもいいわ。だけど、あなたの大切なミュータントがどうなるか・・・。』"
translation = "\"Then stop. But what happens to your precious mutant...?\""
speaker = "Marie Procyon"
context = "Later prologue exchange; Marie threatens Connie to coerce Kanzaki."
status = "qa-ready"
box_width = 61
notes = "The threat remains indirect in grammar but unmistakable in context. 'Then stop' is Marie's cold permission, and 'precious' echoes Kanzaki's attachment. The compact line avoids orphaning its final punctuation at the renderer boundary."

[[entries]]
id = "opening-kanzaki-disgust"
file = "DISKA/FOP.MES"
offset = 0x04be
source_mode = 1
target_mode = 2
source = "「・・・くっ・・・。あなたという人は・・・・・・。」"
translation = "\"...Damn you... How could you...?\""
speaker = "Kaori Kanzaki"
context = "Later prologue exchange; Kanzaki reacts to Marie's threat against Connie."
status = "qa-ready"
box_width = 61
notes = "くっ is a bitten-back sound of anger. The unfinished あなたという人は condemns Marie without a literal, unidiomatic predicate."

[[entries]]
id = "opening-marie-one-subject"
file = "DISKA/FOP.MES"
offset = 0x04dd
source_mode = 1
target_mode = 2
source = "『実験体はひとりだけでもいい。帰ってきたとき監視の目が厳しいのは、わかっている。』"
translation = "\"One test subject will be enough.\nYou know they'll watch us closely when you return.\""
speaker = "Marie Procyon"
context = "Later prologue exchange; Marie narrows her demand to one abducted person from 1996."
status = "qa-ready"
box_width = 61
notes = "監視の目 is the scrutiny surrounding the returning mission. 'Us' reflects their shared conspiracy without naming an unspoken institution. The sentence-boundary newline prevents character-level wrapping."

[[entries]]
id = "opening-kanzaki-silence"
file = "DISKA/FOP.MES"
offset = 0x0512
source_mode = 1
target_mode = 2
source = "「・・・・・・・・・。」"
translation = "\"...\""
speaker = "Kaori Kanzaki"
context = "Later prologue exchange; Kanzaki falls silent under Marie's coercion."
status = "qa-ready"
box_width = 61
notes = "A separate silent record is retained as a dramatic and timing beat."

[[entries]]
id = "opening-marie-orders"
file = "DISKA/FOP.MES"
offset = 0x0523
source_mode = 1
target_mode = 2
source = "『私が担当なら、私が行っている。あなたは指示通りにすればいい。』"
translation = "\"If it were my assignment, I would go myself.\nYou need only follow your orders.\""
speaker = "Marie Procyon"
context = "Later prologue exchange; Marie dismisses Kanzaki's moral objection as an assigned duty."
status = "qa-ready"
box_width = 61
notes = "Marie uses clipped formality as emotional armor. 指示通り is rendered as obedience to orders, not voluntary cooperation. The explicit sentence break preserves that clipped delivery in the text box."

[[entries]]
id = "opening-kanzaki-plea"
file = "DISKA/FOP.MES"
offset = 0x054e
source_mode = 1
target_mode = 2
source = "「あなたは間違ってる！！！　お願い、考え直して！！！」"
translation = "\"You're wrong! Please, reconsider!\""
speaker = "Kaori Kanzaki"
context = "Later prologue exchange; Kanzaki's composure finally breaks as Marie leaves."
status = "qa-ready"
box_width = 61
notes = "The repeated source exclamation marks are compressed while retaining the sudden force and desperate plea."

[[entries]]
id = "opening-door-closes"
file = "DISKA/FOP.MES"
offset = 0x0570
source_mode = 1
target_mode = 2
source = "部屋の扉が閉まる。"
translation = "The door closed."
speaker = "narrator"
context = "Later prologue exchange; Marie ends the confrontation by leaving the room."
status = "qa-ready"
box_width = 61
notes = "The terse present-tense stage direction is naturalized to the surrounding English narrative past."

[[entries]]
id = "opening-kanzaki-wait"
file = "DISKA/FOP.MES"
offset = 0x0580
source_mode = 1
target_mode = 2
source = "「待って・・・、まだ話は終わってないわ！！！」"
translation = "\"Wait! We're not finished yet!\""
speaker = "Kaori Kanzaki"
context = "Later prologue exchange; Kanzaki calls after Marie through the closed door."
status = "qa-ready"
box_width = 61
notes = "話は終わってない is idiomatically 'we're not finished'; the line stays urgent rather than formal."

