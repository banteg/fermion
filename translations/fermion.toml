source_mode = 1
target_mode = 2
source = "時空震動へ、マシンを合わせる。マシンが震動する。"
translation = "I bring the machine into alignment with the Time Quake. The hull begins to vibrate."
speaker = "Connie"
context = "Unit One commits to tunnel entry."
status = "qa-ready"
notes = "Alignment and vibration are separated to preserve the cause-and-effect sequence."

[[entries]]
id = "launch-focuses-on-controls"
file = "DISKA/F0001.MES"
offset = 0x420f
source_mode = 1
target_mode = 2
source = "あたしは時空へ飛び込むという未知の体験の恐さを忘れ、マシンの操作に神経を集中。"
translation = "I forget the fear of plunging into the unknown and put all my concentration into the controls."
speaker = "Connie"
context = "Professional focus overtakes Connie's fear at entry."
status = "qa-ready"
notes = "The line preserves her competence without claiming the fear has permanently vanished."

[[entries]]
id = "launch-enters-time-tunnel"
file = "DISKA/F0001.MES"
offset = 0x4244
source_mode = 1
target_mode = 2
source = "そして・・・・・・・・・・・・・・・・、時空トンネルへ、突入した！"
translation = "And then... I plunge into the time tunnel!"
speaker = "Connie"
context = "Unit One crosses the tunnel threshold."
status = "qa-ready"
notes = "The exclamation retains the action climax while compressing the pause."

[[entries]]
id = "launch-between-times"
file = "DISKA/F0001.MES"
offset = 0x431a
source_mode = 1
target_mode = 2
source = "【コニー】（ここが時空の狭間・・・・・・。）"
translation = "[CONNIE] (So this is the space between times...)"
speaker = "コニー"
context = "Connie sees the interior of the time tunnel."
status = "qa-ready"
notes = "The space between times' is evocative without inventing a formal technical term."

[[entries]]
id = "launch-studies-tunnel-view"
file = "DISKA/F0001.MES"
offset = 0x4336
source_mode = 1
target_mode = 2
source = "あたしはマシンの外の景色を、物珍しげに見た。"
translation = "I study the strange view beyond the machine with open curiosity."
speaker = "Connie"
context = "Connie's wonder returns once entry succeeds."
status = "qa-ready"
notes = "Open curiosity' captures 物珍しげ without making her sound clinically detached."

[[entries]]
id = "launch-tunnel-unnatural-quiet"
file = "DISKA/F0001.MES"
offset = 0x4355
source_mode = 1
target_mode = 2
source = "【コニー】（静かな・・物音が消されるような・・・・・・・・・・・。）"
translation = "[CONNIE] (So quiet... as if every sound is being erased...)"
speaker = "コニー"
context = "Connie notices the tunnel's sound-damping effect."
status = "qa-ready"
notes = "Erased' preserves the uncanny active disappearance of sound."

[[entries]]
id = "launch-sound-swallowed"
file = "DISKA/F0001.MES"
offset = 0x437d
source_mode = 1
target_mode = 2
source = "あたしがカタッと音を立てても、消音壁に音が吸い込まれるように、音が消えていく。"
translation = "Even when I make a small clatter, the sound vanishes as though soundproof walls swallow it."
speaker = "Connie"
context = "Connie tests the tunnel's silence."
status = "qa-ready"
notes = "The soundproof-wall comparison is explicitly figurative in the source."

[[entries]]
id = "launch-world-without-sound"
file = "DISKA/F0001.MES"
offset = 0x43af
source_mode = 1
target_mode = 2
source = "【コニー】（何も・・・・・・・・・・・・、聞こえない世界・・・・・・・・・。）"
translation = "[CONNIE] (A world... where I can't hear anything...)"
speaker = "コニー"
context = "The enhanced-hearing mutant confronts absolute silence."
status = "qa-ready"
notes = "The sensory deprivation has special weight for Connie and remains fragmentary."

[[entries]]
id = "launch-can-watch-awhile"
file = "DISKA/F0001.MES"
offset = 0x43fd
source_mode = 1
target_mode = 2
source = "【コニー】（しばらく・・・・・・・・・見とれてもいいかな？）"
translation = "[CONNIE] (Can I let myself watch for a little while...?)"
speaker = "コニー"
context = "Connie is tempted to linger on the unprecedented view."
status = "qa-ready"
notes = "Let myself' conveys the conflict between wonder and pilot duty."

[[entries]]
id = "launch-watch-time-instead-of-talk"
file = "DISKA/F0001.MES"
offset = 0x4420
source_mode = 1
target_mode = 2
source = "独り言を言うよりも、時間という景色をしばらく見つめたいな。"
translation = "Rather than talk to myself, I want to spend a while watching the landscape of time."
speaker = "Connie"
context = "Connie chooses silent wonder inside the tunnel."
status = "qa-ready"
notes = "Landscape of time' preserves the source's poetic 時間という景色."
