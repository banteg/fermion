file = "DISKA/F0000.MES"
offset = 0x0586
source_mode = 1
target_mode = 2
source = "【神崎】「・・・コニー。私を嫌いになったの？」"
translation = "[KANZAKI] \"...Connie. Don't you love me anymore?\""
speaker = "神崎"
context = "First F0000 scene, replying to Connie before departure."
status = "runtime-verified"
box_width = 61
notes = """
私を嫌いになったの is literally “Have you come to hate me?” The current line
uses the more natural intimate question “Don't you love me anymore?” The source
label gives only the surname Kanzaki; later context identifies her as Dr. Kaori
Kanzaki, but the visible label remains simply KANZAKI here.
"""

