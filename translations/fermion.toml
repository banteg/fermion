speaker = "コニー"
context = "Connie notices another lapse in her enhanced hearing."
status = "qa-ready"
notes = "Even' captures her surprise at missing such an obvious sensory cue."

[[entries]]
id = "launch-normally-hear-footsteps"
file = "DISKA/F0001.MES"
offset = 0x13ef
source_mode = 1
target_mode = 2
source = "普段のあたしなら聞き逃さなかっただろう。"
translation = "Normally, I never would have missed them."
