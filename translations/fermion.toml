translation = "LISTEN"
status = "runtime-verified"
notes = """
Literally “listen to [her] talk.” The object is visually and narratively clear,
so the compact command avoids adding an English pronoun absent from the source.
"""

[[entries]]
id = "first-scene-menu-give-in"
file = "DISKA/F0000.MES"
offset = 0x085b
source_mode = 1
target_mode = 2
source = "体を委ねる"
translation = "GIVE IN"
