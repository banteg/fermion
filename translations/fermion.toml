notes = "Them' refers to the footsteps without needless repetition."

[[entries]]
id = "launch-tired-or-nervous"
file = "DISKA/F0001.MES"
offset = 0x140b
source_mode = 1
target_mode = 2
source = "【コニー】（疲れているのかな・・・、緊張しているのかな・・・。）"
translation = "[CONNIE] (Am I tired...? Or just nervous...?)"
speaker = "コニー"
context = "Connie diagnoses her uncharacteristic inattention."
status = "qa-ready"
notes = "The two questions retain her honest uncertainty."

[[entries]]
id = "launch-rumor-marie-hates-mutants"
file = "DISKA/F0001.MES"
offset = 0x143a
source_mode = 1
target_mode = 2
source = "マリー博士は、噂ではミュータント嫌いだそうだ。"
translation = "Rumor says Dr. Marie hates mutants."
speaker = "Connie"
context = "Connie considers why Marie makes her tense."
status = "qa-ready"
notes = "Rumor says' preserves that Connie does not claim firsthand certainty."

[[entries]]
id = "launch-marie-childhood-prototypes"
file = "DISKA/F0001.MES"
offset = 0x1458
source_mode = 1
target_mode = 2
source = "マリー博士が子供の頃は、ミュータントがまだ試作段階だった。"
translation = "When Dr. Marie was a child, mutants were still in the prototype stage."
speaker = "Connie"
context = "Connie recounts the background to Marie's fear."
status = "qa-ready"
notes = "Prototype stage' preserves the setting's dehumanizing development vocabulary."

[[entries]]
id = "launch-marie-attacked-by-failure"
file = "DISKA/F0001.MES"
offset = 0x1480
source_mode = 1
target_mode = 2
source = "融合に失敗したミュータントに襲われたことがあるからだ、と聞いている。"
translation = "I've heard she was attacked by a mutant whose gene fusion had failed."
speaker = "Connie"
context = "Connie relays the stated cause of Marie's hostility."
status = "qa-ready"
notes = "The failure describes the engineering process, not the person's moral worth."

[[entries]]
id = "launch-marie-harsh-to-mutants"
file = "DISKA/F0001.MES"
offset = 0x14ab
source_mode = 1
target_mode = 2
source = "マリー博士はそのため、時々、あたしたちミュータントにきつい態度をとる。"
translation = "That's why Dr. Marie can be harsh with us mutants."
speaker = "Connie"
context = "Connie connects the childhood attack with Marie's conduct."
status = "qa-ready"
notes = "Can be harsh' leaves room for the occasional nature of her behavior."

[[entries]]
id = "launch-marie-strict-without-kindness"
file = "DISKA/F0001.MES"
offset = 0x14d5
source_mode = 1
target_mode = 2
source = "厳しい態度とも言えるけど、神崎博士と違って、優しさのない厳しさだった。"
translation = "You could call it strictness, but unlike Dr. Kanzaki's, there is no kindness behind it."
speaker = "Connie"
context = "Connie distinguishes Marie's severity from Kanzaki's."
status = "qa-ready"
notes = "This relationship contrast is central to Connie's voice and later judgment of Marie."

[[entries]]
id = "launch-marie-unkind-thought"
file = "DISKA/F0001.MES"
offset = 0x1519
source_mode = 1
target_mode = 2
source = "【コニー】（厳しい態度とも言えるけど、神崎博士と違って、優しさのない厳しさだ・・・。）"
translation = "[CONNIE] (You could call her strict, but unlike Dr. Kanzaki, she isn't kind about it...)"
speaker = "コニー"
context = "Connie repeats the comparison as an internal judgment."
status = "qa-ready"
notes = "The near-duplicate source is contextually distinct and therefore keeps its own canonical entry."

[[entries]]
id = "launch-relaxes-tension"
file = "DISKA/F0001.MES"
offset = 0x1555
source_mode = 1
target_mode = 2
source = "あたしは緊張をほぐす。"
translation = "I try to loosen up."
speaker = "Connie"
context = "Connie consciously releases the tension Marie caused."
status = "qa-ready"
notes = "Try' reflects that her following thoughts remain tense."

[[entries]]
id = "launch-pressure-from-above"
file = "DISKA/F0001.MES"
offset = 0x1565
source_mode = 1
target_mode = 2
source = "【コニー】（体が上から圧迫されている感じがする・・・。）"
