[[entries]]
id = "arrival-body-will-not-move"
file = "DISKA/F0002.MES"
offset = 0x0a7a
source_mode = 1
target_mode = 2
source = "【コニー】（力が・・・。・・・・・・体が・・・、動かせない・・・・・・。）"
