[[entries]]
id = "opening-doctor-warning"
file = "DISKA/FOP.MES"
offset = 0x016c
source_mode = 1
target_mode = 2
source = "「見ない方がいいですよ。あなたのお気持ちはわかりますが・・・。」"
translation = "\"Don't look. I understand, but...\""
speaker = "prologue-doctor"
context = "Unlabelled prologue exchange; the doctor cautions the viewpoint woman."
status = "runtime-proof"
box_width = 61
notes = """
The speaker appears to be the doctor escorting the protagonist. A more literal
opening is “It would be better not to look.” Revisit tone once speaker names and
the surrounding scene are established. ASCII quotation marks, apostrophe,
comma, and periods are all runtime-verified.
"""

[[entries]]
id = "opening-request-to-see-him"
file = "DISKA/FOP.MES"
offset = 0x0193
source_mode = 1
target_mode = 2
source = "『いいえ・・・。私の・・・・・・大切な人です。見届けさせてください。』"
translation = "\"No... He's someone very dear to me. Please let me see him...\""
speaker = "prologue-viewpoint"
context = "Unlabelled prologue exchange; the viewpoint woman answers the doctor."
status = "runtime-proof"
box_width = 61
notes = """
大切な人 may be “someone precious/important to me.” 見届けさせてください is
closer to “please let me see this through” or “let me watch over him” than the
current proof wording. The 62-byte runtime probe intentionally leaves the final
quote on a second line and proves that the engine wraps by character, not word.
The catalog preview word-wraps this sentence without changing the stored line.
"""

[[entries]]
id = "opening-doctor-this-way"
file = "DISKA/FOP.MES"
offset = 0x01bc
source_mode = 1
target_mode = 2
source = "「・・・・・・・・・・・・・・・・・・わかりました。・・・こちらです・・・。」"
translation = "\"This way...\""
speaker = "prologue-doctor"
context = "Unlabelled prologue exchange; the doctor relents and leads the way."
status = "runtime-proof"
box_width = 61
notes = """
The source also says わかりました (“I understand/very well”). It was omitted
from the first runtime probe to compensate for the preceding line's growth.
Catalog builds now support file growth, so the technical constraint is gone;
restore that nuance during the next editorial pass rather than silently
changing an already recorded runtime proof.
"""

[[entries]]
id = "first-scene-connie-resists"
file = "DISKA/F0000.MES"
offset = 0x0554
source_mode = 1
target_mode = 2
source = "【コニー】「あンッ、だ・・・だめです・・・。明日は・・・・・・出発だから・・・・・・。」"
translation = "[CONNIE] \"Ah... n-no... We leave tomorrow...\""
speaker = "コニー"
context = "First F0000 scene, in Dr. Kanzaki's room before departure."
status = "runtime-verified"
box_width = 61
notes = """
This is the first line in F0000.MES and the first runtime target with an inline
speaker label. 出発だから is literally “because [we] depart”; “we leave” is a
natural contextual compression. The interrupted だめです is kept as “n-no.”
"""

[[entries]]
id = "first-scene-kanzaki-asks"
file = "DISKA/F0000.MES"
offset = 0x0586
source_mode = 1
target_mode = 2
source = "【神崎】「・・・コニー。私を嫌いになったの？」"
translation = "[KANZAKI] \"...Connie. Don't you love me anymore?\""
speaker = "神崎"
context = "First F0000 scene, replying to Connie before departure."
status = "runtime-verified"
box_width = 61
notes = """
私を嫌いになったの is literally “Have you come to hate me?” The current line
uses the more natural intimate question “Don't you love me anymore?” The source
label gives only the surname Kanzaki; later context identifies her as Dr. Kaori
Kanzaki, but the visible label remains simply KANZAKI here.
"""

[[entries]]
id = "first-scene-connie-explains"
file = "DISKA/F0000.MES"
offset = 0x05a2
source_mode = 1
target_mode = 2
source = "【コニー】「そ・・・そうじゃありません。明日に備えて休んでおいた方がいいかなと・・・。」"
translation = "[CONNIE] \"No... I just thought we should rest for tomorrow.\""
speaker = "コニー"
context = "First F0000 scene, answering Dr. Kanzaki before departure."
status = "runtime-verified"
box_width = 61
notes = """
明日に備えて means “in preparation for tomorrow.” The 60-character English
line includes its speaker label and stays just under the observed 61 half-width
character boundary, avoiding an automatic mid-word wrap.
"""

