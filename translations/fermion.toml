notes = "The English idiom naturally renders 目線が釘付け."

[[entries]]
id = "launch-theory-versus-doing"
file = "DISKA/F0001.MES"
offset = 0x1217
source_mode = 1
target_mode = 2
source = "理論上、できるとわかっている事でも、いざ実行する当事者になると不安が募る。"
translation = "Knowing something works in theory doesn't stop the fear when you're the one putting it to the test."
speaker = "Connie"
context = "Connie contrasts Project D theory with being its first pilot."
status = "qa-ready"
notes = "The English stays reflective but informal, matching Connie rather than a scientist."

[[entries]]
id = "launch-only-in-theory"
file = "DISKA/F0001.MES"
offset = 0x1247
source_mode = 1
target_mode = 2
source = "【コニー】（理論上・・・、確かに理論の上では・・・そう。）"
translation = "[CONNIE] (In theory... Sure. In theory...)"
speaker = "コニー"
context = "Connie dryly repeats the qualification."
status = "qa-ready"
notes = "The repetition carries her skepticism and rising nerves."

[[entries]]
id = "launch-volunteered-pilot"
file = "DISKA/F0001.MES"
offset = 0x1275
source_mode = 1
target_mode = 2
