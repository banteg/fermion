source_mode = 1
target_mode = 2
source = "神崎博士を見る"
translation = "LOOK AT DR. KANZAKI"
status = "runtime-verified"
notes = """
Literal choice: “Look at Dr. Kanzaki.” The imperative menu style matches the
checked-in title actions and preserves the source's 博士 title.
"""

[[entries]]
id = "first-scene-menu-listen"
file = "DISKA/F0000.MES"
